name = "mcqticker-online"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
# pages_build_output_dir = "./dist" # Commented out to allow local dev proxy

[[d1_databases]]
binding = "DB"
database_name = "mcqticker-reviews"
database_id = "5e162d34-ff87-434d-a48d-ca02a0a49477"

# To create the database, run:
#   npx wrangler d1 create mcqticker-reviews
# Then replace the database_id above with the one returned.

# To create the reviews table, run:
#   npx wrangler d1 execute mcqticker-reviews --local --command "CREATE TABLE IF NOT EXISTS reviews (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, rating INTEGER NOT NULL CHECK(rating BETWEEN 1 AND 5), review TEXT NOT NULL, exam TEXT, created_at TEXT NOT NULL DEFAULT (datetime('now')), approved INTEGER NOT NULL DEFAULT 1);"

# To create the users table for authentication, run:
#   npx wrangler d1 execute mcqticker-reviews --local --command "CREATE TABLE IF NOT EXISTS users (id TEXT PRIMARY KEY, email TEXT UNIQUE NOT NULL, password_hash TEXT NOT NULL, salt TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT (datetime('now')));"

# To create the todos table, run:
#   npx wrangler d1 execute mcqticker-reviews --local --command "CREATE TABLE IF NOT EXISTS todos (id TEXT PRIMARY KEY, user_id TEXT NOT NULL, date TEXT NOT NULL, task_text TEXT NOT NULL, is_completed INTEGER NOT NULL DEFAULT 0, created_at TEXT NOT NULL DEFAULT (datetime('now')));"

# To create the mcq_sessions table, run:
#   npx wrangler d1 execute mcqticker-reviews --local --command "CREATE TABLE IF NOT EXISTS mcq_sessions (id INTEGER PRIMARY KEY AUTOINCREMENT, user_id TEXT NOT NULL, sessions_data TEXT NOT NULL DEFAULT '{}', updated_at TEXT NOT NULL DEFAULT (datetime('now')), UNIQUE(user_id));"
